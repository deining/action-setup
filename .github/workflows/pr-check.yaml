name: pr-check

on:
  - push
  - pull_request
  - workflow_dispatch

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@2e223e0f0d2b8fd9872cbadb8b7428e5f8b5556d # v6-pre
        with:
          run_install: true
          version: 10.33.0

      - name: Print pnpm version
        run: pnpm --version

      - name: Print md5sum
        run: md5sum dist/index.js

      - name: Update dist/index.js
        run: pnpm run build

      - name: Print Print md5sum again
        run: md5sum dist/index.js

      - name: Check for uncommitted changes in dist
        run: git diff --exit-code dist/index.js
